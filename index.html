<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>young team</title>
  <meta name="description" content="young team &mdash; games that don't say their name.">
  <link rel="alternate" hreflang="en" href="https://youngteam.net/en/">
  <link rel="alternate" hreflang="fr" href="https://youngteam.net/fr/">
  <link rel="alternate" hreflang="x-default" href="https://youngteam.net/">
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      background: #000; color: rgba(255,255,255,0.45);
      font-family: sans-serif; font-size: 0.9rem; letter-spacing: 2px;
    }
    a { color: #fff; text-decoration: none; }
  </style>
  <script>
    // french-speaking browsers get the french site; everyone else lands on english.
    var fr = /^fr\b/i.test(navigator.language || '');
    location.replace((fr ? '/fr/' : '/en/') + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body>
  <a href="/en/">english</a><span>/</span><a href="/fr/">français</a>
</body>
</html>
